name: Full local stack integration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - run: pip install uv==0.13.8
      - run: uv sync --project backend --frozen
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: pwsh -NoProfile -File scripts/validate_initialization.ps1
      - run: uv run --project backend --frozen python scripts/validate_stack.py --restart-backend
      - run: uv run --project backend --frozen python scripts/validate_n8n.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-stack-evidence
          include-hidden-files: true
          path: |
            .local/validation/stack.json
            .local/validation/n8n.json
            frontend/playwright-report
            docs/screenshots
      - if: always()
        run: docker compose down
