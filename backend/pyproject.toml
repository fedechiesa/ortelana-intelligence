[project]
name = "ortelana-intelligence"
version = "1.0.0"
description = "Deterministic business analysis with durable human supervision"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0", "uvicorn==0.54.0", "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9", "alembic==1.20.1", "psycopg[binary,pool]==3.3.9",
  "langgraph==1.2.24", "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3", "pandas==3.1.1", "numpy==2.5.5",
  "tenacity==9.2.1", "prometheus-client==0.26.0"
]
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.6", "mypy==2.4.1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a dedicated PostgreSQL test database"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations", "tests"]
disable_error_code = ["import-untyped"]
