name: Continuous integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  history-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan complete history with checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact --no-banner
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ortelana_admin
          POSTGRES_PASSWORD: demo-postgres-admin-local
          POSTGRES_DB: ortelana_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ortelana_admin -d ortelana_test" --health-interval 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ortelana:demo-db-local@127.0.0.1:5432/ortelana_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.8
      - run: uv sync --project backend --frozen
      - name: Create restricted application identity
        run: |
          uv run --project backend --frozen python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://ortelana_admin:demo-postgres-admin-local@127.0.0.1:5432/ortelana_test', autocommit=True) as connection:
              connection.execute("CREATE ROLE ortelana LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'demo-db-local'")
              connection.execute('ALTER DATABASE ortelana_test OWNER TO ortelana')
              connection.execute('GRANT USAGE,CREATE ON SCHEMA public TO ortelana')
          PY
      - run: uv run --project backend --frozen ruff check --config backend/pyproject.toml backend scripts
      - run: uv run --project backend --frozen ruff format --config backend/pyproject.toml --check backend scripts
      - run: uv run --project backend --frozen mypy --config-file backend/pyproject.toml backend/app
      - run: uv run --project backend --frozen pytest backend/tests -q
      - run: uv run --project backend --frozen python scripts/check_public_tree.py --history
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
